<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="results">RUNNING</pre><iframe id="app" src="../index.html"></iframe><script>
const frame=document.getElementById('app');

 const w=frame.contentWindow,d=w.document,run=code=>w.eval(code),assert=(v,m)=>{if(!v)throw Error(m)},results=[];

 }

 }
 results.push('PASS: original expeditions, completion, saved hints and mistakes');

 results.push('PASS: expert mode');

 assert(d.querySelectorAll('[data-guide]').length>2,'found stars extend guides');

 assert(d.querySelector('[data-scale="10"]'),'angular ruler');
 const marker=d.querySelector('[data-marker="Betelgeuse"]'),matrix=d.getElementById('sky').getScreenCTM(),radius=Number(marker.getAttribute('r'))*matrix.a;
 run('zoomAt(.5)');const zoomed=d.querySelector('[data-marker="Betelgeuse"]'),zoomMatrix=d.getElementById('sky').getScreenCTM();assert(Math.abs(Number(zoomed.getAttribute('r'))*zoomMatrix.a-radius)<.01,'marker screen size stays fixed when zoomed');
 assert(run('Math.hypot(points.Betelgeuse[0]-points.Rigel[0],points.Betelgeuse[1]-points.Rigel[1])>190'),'Orion angular spacing not compressed');
 assert(run('missions.every(m=>m.targets.length===missions[0].targets.length && missions[0].targets.every(t=>m.targets.some(other=>other[0]===t[0])))'),'same expedition targets across reference charts');
 results.push('PASS: stable selection and chart switching, progress, found-star guides, grid toggle, degree ruler, constant marker size, Orion spacing');
 assert(run('messierObjects.length===110&&messierObjects.every((o,i)=>o.number===i+1)'),'complete M1?M110');
 assert(run('new Set([...brightStars,...messierObjects].map(o=>o.name)).size===brightStars.length+110'),'unique catalog keys');
 assert(run('[...brightStars,...messierObjects].every(o=>o.ra>=0&&o.ra<24&&o.dec>=-90&&o.dec<=90&&missions[0].targets.some(t=>t[0]===o.name))'),'coordinate bounds and target coverage');
 assert(run('brightStars.every(s=>separation(unproject(...chartPoint(s)),s)<1e-4)'),'all 1637 star projection round trips');

 d.getElementById('mode').value='guided';run('region=0;reset();showLines=false;update()');

  search(name);assert(!d.querySelector('[data-star="'+name+'"]'),'Messier hidden '+name);
  const state=run('JSON.stringify({view,region,score,found})');run('chooseCatalogStar("Sirius")');search(name);assert(run('JSON.stringify({view,region,score,found})')===state,'selection stable '+name);
  assert(run('separation(unproject(...points[missions[region].targets[index][0]]),stars[missions[region].targets[index][0]])<1e-4'),'Messier projection '+name);
  run('const p=points[missions[region].targets[index][0]];view={x:p[0]-500,y:p[1]-350,w:1000,h:700};applyView();guessAt(...p)');
  assert(run('found.includes(missions[region].targets[index][0])'),'Messier scoring '+name);assert(d.querySelector('[data-star="'+name+'"][data-kind="messier"] path'),'Messier diamond '+name);
 }
 assert(run('score===11000&&found.length===110'),'Messier cumulative score');assert(d.getElementById('next').hidden,'completed Messier library has no next target');
 const stable=run('JSON.stringify({view,region,score,found})');d.getElementById('target-library').value='star';d.getElementById('target-library').dispatchEvent(new w.Event('change'));d.getElementById('target-library').value='messier';d.getElementById('target-library').dispatchEvent(new w.Event('change'));assert(run('JSON.stringify({view,region,score,found})')===stable,'library toggles preserve progress and view');assert(d.getElementById('target').textContent==='M110','remember selected Messier');
 d.getElementById('target-library').value='star';d.getElementById('target-library').dispatchEvent(new w.Event('change'));assert(d.querySelectorAll('#targets button').length===30,'paged star picker');assert(d.querySelectorAll('#star-options option').length<=40,'bounded suggestions');d.getElementById('targets-next').click();assert(d.getElementById('target-page').textContent.includes('31–60'),'next target page');d.getElementById('targets-prev').click();assert(d.getElementById('target-page').textContent.includes('1–30'),'previous target page');
 d.getElementById('star-query').value='alpha orion';d.getElementById('star-query').dispatchEvent(new w.Event('input'));assert(d.querySelectorAll('#targets button').length===1&&d.querySelector('#targets button').textContent.includes('Betelgeuse'),'live library filter');
 run('reset();chooseCatalogStar("M31");guessAt(...points.M31)');d.getElementById('next').click();assert(d.getElementById('target').textContent==='M1'&&d.getElementById('target-library').value==='messier','next stays in Messier library');assert(d.querySelector('#targets .selected').textContent.includes('M1'),'next target visible in picker');
 results.push('PASS: all 1637 star coordinates and target coverage, all 110 Messier objects hidden and solvable, names and IDs, diamond markers, cumulative scoring, library selection, pagination and live filtering');
 d.getElementById('mode').value='guided';d.getElementById('target-library').value='star';
 run('region=0;reset();chooseCatalogStar("Betelgeuse");guessAt(...points.Betelgeuse);chooseCatalogStar("Mirach");hinted=true;mistakes=1;showNames=false;lineOverrides.set(connectionKey("Betelgeuse","Rigel"),true);view={x:250,y:100,w:500,h:350};applyView()');
 const seasonalState=run('JSON.stringify({score,found,target:missions[region].targets[index][0],hinted,mistakes,showNames,connections:[...lineOverrides]})');
 const autumnButton=[...d.querySelectorAll('[data-region]')].find(button=>button.textContent.includes('Autumn'));
 const springButton=[...d.querySelectorAll('[data-region]')].find(button=>button.textContent.includes('Spring'));
 assert(autumnButton&&springButton,'seasonal tabs available');autumnButton.click();
 const autumn=run('region');
 assert(run('JSON.stringify({score,found,target:missions[region].targets[index][0],hinted,mistakes,showNames,connections:[...lineOverrides]})')===seasonalState,'autumn retains target, attempt, progress, labels and connections');
 assert(autumnButton.classList.contains('active')&&d.getElementById('chart-choice').value===String(autumn),'autumn tab and selector agree');
 assert(d.getElementById('map-title').textContent.includes('PEGASUS'),'autumn map title');
 assert(run('missions[region].reference.length===4&&["Markab","Scheat","Alpheratz","Algenib"].every(name=>missions[region].reference.includes(name))'),'Great Square reference stars');
 assert(run('missions[region].reference.every(name=>points[name][0]>0&&points[name][0]<1000&&points[name][1]>0&&points[name][1]<700)'),'Great Square fits the default chart across RA zero');
 assert(run('transform.scale===600&&Math.hypot(points.Markab[0]-points.Scheat[0],points.Markab[1]-points.Scheat[1])>130'),'autumn retains true angular spacing');
 assert(d.querySelectorAll('[data-guide]').length===4&&!d.querySelector('.star-label'),'square guides and retained hidden names');
 search('M31');assert(run('region')===autumn&&!d.querySelector('[data-star="M31"]'),'autumn Messier selection stays on chart and hides target');
 run('guessAt(...points.M31)');assert(run('score===200&&found.includes("M31")'),'M31 solvable from Pegasus');
 search('Markab');assert(!d.querySelector('[data-star="Markab"]'),'selected autumn reference star hidden');run('guessAt(...points.Markab)');assert(d.querySelectorAll('[data-guide]').length===4,'found reference restores square');
 run('view={x:200,y:100,w:500,h:350};applyView()');const autumnView=run('JSON.stringify(view)');
 search('M65');springButton.click();const spring=run('region');
 assert(springButton.classList.contains('active')&&d.getElementById('chart-choice').value===String(spring),'spring tab and selector agree');
 assert(d.getElementById('map-title').textContent.includes('LEO'),'spring map title');
 assert(run('missions[region].reference.length===9&&missions[region].reference.every(name=>points[name][0]>0&&points[name][0]<1000&&points[name][1]>0&&points[name][1]<700)'),'Leo reference pattern fits default chart');
 assert(d.querySelectorAll('[data-guide]').length===10,'Sickle and Leo body guides');
 assert(run('transform.scale===600&&Math.hypot(points.Regulus[0]-points.Denebola[0],points.Regulus[1]-points.Denebola[1])>240'),'spring retains true angular spacing');
 assert(d.getElementById('target').textContent==='M65'&&!d.querySelector('[data-star="M65"]'),'spring retains hidden Messier target');run('guessAt(...points.M65)');assert(run('score===400&&found.includes("M65")'),'M65 solvable from Leo');
 search('Regulus');assert(!d.querySelector('[data-star="Regulus"]'),'selected spring reference star hidden');run('guessAt(...points.Regulus)');assert(d.querySelectorAll('[data-guide]').length===10,'found reference restores Leo guides');
 run('view={x:150,y:50,w:600,h:420};applyView()');const springView=run('JSON.stringify(view)');
 d.getElementById('chart-choice').value=String(autumn);d.getElementById('chart-choice').dispatchEvent(new w.Event('change'));
 assert(run('JSON.stringify(view)')===autumnView&&autumnButton.classList.contains('active'),'selector restores autumn view and tab');
 springButton.click();assert(run('JSON.stringify(view)')===springView,'spring view restored');
 run('changeChart(0)');assert(run('view.w===500&&score===500&&found.length===5&&showNames===false&&lineOverrides.size===1'),'returning to original chart retains view and seasonal progress');
 frame.style.width='320px';frame.style.height='1000px';
 const mobileTabs=[...d.querySelectorAll('[data-region]')],mobileBounds=d.querySelector('.regions').getBoundingClientRect();
 assert(mobileTabs.length===5&&mobileTabs.every(button=>{const bounds=button.getBoundingClientRect();return bounds.left>=mobileBounds.left-1&&bounds.right<=mobileBounds.right+1&&bounds.width>=button.scrollWidth-1;}),'all five tabs fit a narrow mobile viewport');
 results.push('PASS: Pegasus and Leo references, RA wrap, angular scale, seasonal guides, hidden references, Messier placement, tab/selector synchronization, preserved targets/attempts/progress/connections/views and mobile layout');
 document.getElementById('results').textContent=results.join('\n');

}catch(e){document.getElementById('results').textContent='FAIL: '+e.stack;}};
</script></body></html>
