<!doctype html><html><head><meta charset="utf-8"><style>iframe{width:1200px;height:1100px;border:0}</style></head><body><pre id="results">RUNNING</pre><iframe id="app" src="../constellations.html"></iframe><script>
const frame=document.getElementById('app');
frame.onload=()=>{const w=frame.contentWindow,d=w.document,run=code=>w.eval(code),assert=(value,message)=>{if(!value)throw Error(message)},results=[];try{
 const svg=d.getElementById('constellation-sky');
 function setStarting(value){d.getElementById('starting-magnitude').value=value;d.getElementById('starting-magnitude').dispatchEvent(new w.Event('change'));}
 function submit(name){d.getElementById('answer').value=name;d.getElementById('answer-form').dispatchEvent(new w.Event('submit',{cancelable:true}));}
 function stable(){return run('JSON.stringify({current:ConstellationGame.state.current,phase:ConstellationGame.state.phase,view:ConstellationGame.state.view,center:ConstellationGame.state.center,named:ConstellationGame.state.correctNames,neighbors:ConstellationGame.state.correctNeighbors,pending:ConstellationGame.state.pending,claims:[...ConstellationGame.state.claimed],found:[...ConstellationGame.state.foundNeighbors]})');}
 assert(d.getElementById('magnitude').value==='4.00'&&d.getElementById('starting-magnitude').value==='4.00','separate defaults preserve previous behavior');
 const expected=run('(()=>{const values=new Map([...SkyGeometry.atlas.keys()].map(id=>[id,Infinity]));for(const star of brightStars){const id=SkyGeometry.constellationAt(star);values.set(id,Math.min(values.get(id),star.mag));}return [...values];})()');
 for(const [id,mag] of expected)assert(run('ConstellationGame.brightestMagnitude.get('+JSON.stringify(id)+')')===mag,'minimum catalog magnitude '+id);
 setStarting('2.00');assert(run('ConstellationGame.state.startingLimit===2&&ConstellationGame.state.limit===4'),'starting threshold independent of displayed stars');
 assert(run('ConstellationGame.eligible().every(id=>ConstellationGame.brightestMagnitude.get(id)<=2)'),'all eligible patterns have a bright enough star');
 assert(run('ConstellationGame.eligible().length')===expected.filter(([,mag])=>mag<=2).length,'exact eligible set');
 run('ConstellationGame.startRound("Ori")');const original=stable();
 assert([...svg.querySelectorAll('[data-magnitude]')].some(node=>Number(node.dataset.magnitude)>2)&&[...svg.querySelectorAll('[data-magnitude]')].every(node=>Number(node.dataset.magnitude)<=4),'full magnitude-4 pattern remains displayed');
 setStarting('1.00');assert(stable()===original,'qualifying pattern retains its view and all progress');
 for(let i=0;i<30;i++){run('ConstellationGame.nextRound()');assert(run('ConstellationGame.brightestMagnitude.get(ConstellationGame.state.current)<=1&&ConstellationGame.visibleStars().length>0'),'every sampled new round obeys threshold');}
 const leoMag=run('ConstellationGame.brightestMagnitude.get("Leo")');setStarting(String(leoMag));
 assert(run('ConstellationGame.canStart("Leo")&&ConstellationGame.startRound("Leo")'),'inclusive brightest-star boundary');
 setStarting((leoMag-.01).toFixed(2));assert(!run('ConstellationGame.canStart("Leo")')&&run('ConstellationGame.state.current!=="Leo"'),'new threshold replaces nonqualifying unanswered pattern');
 const beforeDenied=stable();assert(!run('ConstellationGame.startRound("Leo")')&&stable()===beforeDenied,'direct selection cannot bypass starting rule');
 const priorThreshold=run('ConstellationGame.state.startingLimit');
 for(const bad of ['-2.00','-2.01','5.01','']){const before=stable();setStarting(bad);assert(run('ConstellationGame.state.startingLimit')===priorThreshold&&stable()===before&&d.getElementById('starting-magnitude').value===priorThreshold.toFixed(2),'invalid or empty candidate set rejected without state loss '+bad);}
 assert(!run('ConstellationGame.setStartingMagnitude(NaN)')&&!run('ConstellationGame.setStartingMagnitude(Infinity)'),'nonfinite threshold rejected');
 results.push('PASS: independent controls, true catalog minimum, exact candidate set, random selection, inclusive threshold, unchanged star visibility, safe replacement and invalid-input protection');
 setStarting('4.00');run('ConstellationGame.startRound("Ori")');submit('Orion');submit('Taurus');
 run('const a=SkyGeometry.atlas.get("Ori").anchors.Tau;const p=ConstellationGame.chartPoint({ra:a[0],dec:a[1]});ConstellationGame.placeNeighbor(p.x,p.y)');submit('Gemini');
 const identified=stable();setStarting('0.00');assert(stable()===identified&&run('ConstellationGame.state.correctNames+ConstellationGame.state.correctNeighbors===2'),'tightening threshold keeps identified round, found stars, pending guess and score');
 run('ConstellationGame.nextRound()');assert(run('ConstellationGame.brightestMagnitude.get(ConstellationGame.state.current)<=0&&ConstellationGame.state.correctNames+ConstellationGame.state.correctNeighbors===2'),'next round uses restriction and retains score');
 setStarting('5.00');run('ConstellationGame.setMagnitude(0)');assert(run('ConstellationGame.eligible().every(id=>ConstellationGame.brightestMagnitude.get(id)<=0)'),'display limit still requires at least one visible star');
 const globalMinimum=Math.min(...expected.map(([,mag])=>mag));setStarting(globalMinimum.toFixed(2));assert(run('ConstellationGame.eligible().length===1'),'single-candidate selection supported at exact minimum');
 run('ConstellationGame.nextRound();ConstellationGame.nextRound()');assert(run('ConstellationGame.visibleStars().length>0'),'single-candidate cycling never creates an empty round');
 results.push('PASS: recognized-round preservation, next-round restriction, combined conditions, score retention and single-pattern cycling');
 run('ConstellationGame.setMagnitude(4);ConstellationGame.setMode("conquer")');setStarting('-1.00');
 assert(run('ConstellationGame.state.current==="CMa"&&ConstellationGame.eligible().length===1'),'restricted Conquer seed chosen automatically');submit('Canis Major');
 const claimed=stable();setStarting('-1.10');assert(stable()===claimed,'active conquest preserved on threshold change');
 let count=1;
 while(run('ConstellationGame.state.claimed.size')<88){
  const available=run('ConstellationGame.frontier()');assert(available.length>0,'starting restriction does not block frontier');const id=available[0];
  const source=run('[...ConstellationGame.state.claimed.keys()].find(parent=>SkyGeometry.atlas.get(parent).neighbors.includes('+JSON.stringify(id)+'))');
  run('ConstellationGame.focusOn('+JSON.stringify(source)+')');submit(run('SkyGeometry.atlas.get('+JSON.stringify(id)+').name'));
  assert(run('ConstellationGame.state.pending')===id,'fainter neighbors accepted '+id);
  run('const a=SkyGeometry.atlas.get('+JSON.stringify(source)+').anchors['+JSON.stringify(id)+'];const p=ConstellationGame.chartPoint({ra:a[0],dec:a[1]});ConstellationGame.placeNeighbor(p.x,p.y)');
  assert(run('ConstellationGame.state.claimed.size')===++count,'claim accepted regardless of starting brightness '+id);
 }
 assert(run('ConstellationGame.state.phase==="complete"&&ConstellationGame.state.correctNames+ConstellationGame.state.correctNeighbors===88&&ConstellationGame.state.claimed.has("Men")'),'all 88 reachable under strict starting threshold');
 frame.style.width='320px';frame.style.height='1200px';assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'mobile no horizontal overflow');
 for(const id of ['magnitude','starting-magnitude','game-mode']){const bounds=d.getElementById(id).getBoundingClientRect();assert(bounds.left>=0&&bounds.right<=d.documentElement.clientWidth,'mobile magnitude control fits '+id);}
 results.push('PASS: restricted Conquer starting pattern, preserved claims and pending state, unrestricted discovery of all 88 including starless regions, and mobile controls');
 document.getElementById('results').textContent=results.join('\n');
}catch(error){document.getElementById('results').textContent='FAIL: '+error.stack;}};
</script></body></html>
